<div
  class="menu-container"
  [style.left.px]="x"
  [style.top.px]="y"
>
  <div class="options">
    <button
      class="btn"
      (click)="apply.emit()"
    >
      Apply to all
    </button>
  </div>
  <div class="py-2">
    <button
      class="btn"
      (click)="close.emit()"
    >
      Close
    </button>
  </div>
</div>
